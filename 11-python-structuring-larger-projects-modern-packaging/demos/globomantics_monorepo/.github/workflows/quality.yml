name: Quality – Black & Pylint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # 1. Check out repository
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install lint/format tools
      - name: Install Black & Pylint
        run: |
          pip install --upgrade pip
          pip install black pylint

      # 4. Install all monorepo packages (so Pylint can import them)
      - name: Install monorepo packages
        run: |
          for pkg in shared data analytics billing plugins cli; do
            echo "Installing $pkg..."
            pip install "./$pkg"
          done

      # 5. Run Black (format check only)
      - name: Black – Format Check
        run: black --check .

      # 6. Run Pylint against all packages
      - name: Pylint – Lint Check
        run: |
          # Run Pylint on src folders of each package
          for pkg in shared data analytics billing plugins cli; do
            echo "--- Running pylint on $pkg ---"
            pylint $(find "$pkg/src" -name "*.py")
          done
