[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "globomantics_platform"
version = "0.1.0"
description = "Globomantics platform core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
globomantics = "globomantics_cli.main:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
include = [
    "src/globomantics_cli",
    "src/globomantics_platform"
]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.envs.default]
python = "3.11"
dependencies = ["pytest"]
install-project = true
paths = ["src"]
